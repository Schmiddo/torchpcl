name: Documentation

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: astral-sh/setup-uv@v10.0.1
      - run: uv run --no-project --with zensical==0.0.59 zensical build --clean --strict
      - name: Generate wheel index
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 tools/generate_wheel_index.py
          --repository "${GITHUB_REPOSITORY}"
          --output site/wheels/index.html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - uses: actions/deploy-pages@v5
        id: deployment
