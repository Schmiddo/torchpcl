name: Build wheels

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    # The extension uses only torch's stable ABI and Python's limited API, so
    # one cp312-abi3 wheel per torch build (CPU or CUDA) and architecture
    # serves every torch >= 2.10 and CPython >= 3.12. It is built against the
    # oldest supported torch, so it cannot depend on anything newer. A CUDA
    # wheel links torch's CUDA libraries and fails to load with a CPU torch.
    name: Build ${{ matrix.stack.cuda }}, ${{ matrix.platform.arch }}
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 60
    env:
      WHEEL_LOCAL_VERSION: ${{ matrix.stack.cuda }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
        stack:
          - cuda: cu130
            toolkit: "13.0.2"
            torch: "2.10.0"
          # cu126 is the CUDA 12 build torch publishes for every supported
          # version; the wheel also loads with cu128 and cu129 torch.
          - cuda: cu126
            toolkit: "12.6.3"
            torch: "2.10.0"
          - cuda: cpu
            torch: "2.10.0"

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          activate-environment: true
          enable-cache: false
          # Any CPython >= 3.12 builds the same abi3 wheel. uv's 3.12 names
          # clang++ as the extension compiler; 3.14 names the system c++.
          python-version: "3.14"

      - name: Install CUDA toolkit
        if: matrix.stack.toolkit
        id: cuda
        uses: Jimver/cuda-toolkit@v0.2.36
        with:
          cuda: ${{ matrix.stack.toolkit }}
          method: network
          sub-packages: '["nvcc", "cudart-dev"]'
          non-cuda-sub-packages: '["libcublas-dev", "libcusparse-dev", "libcusolver-dev", "libcurand-dev", "libcufft-dev"]'
          log-file-suffix: ${{ matrix.stack.cuda }}-${{ matrix.platform.arch }}.txt

      - name: Install build dependencies
        run: |
          uv pip install \
            "torch==${{ matrix.stack.torch }}" \
            ninja "setuptools>=77" \
            --torch-backend ${{ matrix.stack.cuda }}

      - name: Build wheel
        env:
          CUDA_HOME: ${{ steps.cuda.outputs.CUDA_PATH }}
          MAX_JOBS: "2"
          TORCHPCL_WITH_CUDA: ${{ matrix.stack.toolkit && '1' || '0' }}
          TORCH_CUDA_ARCH_LIST: "8.0;8.6;8.9;9.0+PTX"
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
              public_version="${GITHUB_REF_NAME#v}"
          else
              public_version="$(uv version --short)"
          fi
          uv version --frozen "${public_version}+${WHEEL_LOCAL_VERSION}"
          uv build --wheel --no-build-isolation

      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.stack.cuda }}-${{ matrix.platform.arch }}
          path: dist/*+${{ env.WHEEL_LOCAL_VERSION }}-cp312-abi3-*.whl
          if-no-files-found: error

  test:
    # The CPU test suite against the built wheel on the oldest and newest
    # supported torch and Python. The runners have no GPU, so CUDA tests skip;
    # loading a CUDA wheel still resolves its CUDA libraries from torch.
    name: Test ${{ matrix.stack.cuda }}, ${{ matrix.platform.arch }}, Python ${{ matrix.target.python }}, Torch ${{ matrix.target.torch }}
    needs: build
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        platform:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
        stack:
          - cuda: cu130
          - cuda: cu126
          - cuda: cpu
        target:
          - python: "3.12"
            torch: "2.10.0"
          - python: "3.14"
            torch: "2.14.0"

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          activate-environment: true
          enable-cache: false
          python-version: ${{ matrix.target.python }}

      - uses: actions/download-artifact@v8
        with:
          name: wheels-${{ matrix.stack.cuda }}-${{ matrix.platform.arch }}
          path: dist

      - name: Install wheel
        run: |
          uv pip install \
            "torch==${{ matrix.target.torch }}" dist/*.whl pytest \
            --torch-backend ${{ matrix.stack.cuda }}

      - name: Run tests
        # The src/ layout keeps the checkout's package off sys.path, so the
        # tests import the installed wheel (printed below).
        run: |
          python -c "import torch, torchpcl; print(torch.__version__, torchpcl.__file__)"
          python -m pytest -q --ignore-glob='tests/test_benchmark_*'

  release:
    name: Publish release
    needs: [build, test]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*.whl
          fail_on_unmatched_files: true
          generate_release_notes: true

  pages:
    name: Publish documentation and wheel index
    needs: release
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/docs.yml
